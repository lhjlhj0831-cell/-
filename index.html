function KT(s){const m=(s||'').match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);if(!m)return 0;let h=(+m[2])%12;if(m[1]==='오후')h+=12;return h*60+(+m[3])}
function parseChat(raw,kk,def){const out=[];let dk=def||'',dl='',time=null;
  raw.trim().split('\n').forEach(line=>{line=line.trim();if(!line)return;
    const d=line.match(/^\[(\d{4})년 (\d{1,2})월 (\d{1,2})일(.*)\]$/);
    if(d){dk=d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');dl=line.slice(1,-1);const tm=d[4].match(/(오전|오후) \d{1,2}:\d{2}/);if(tm){time=tm[0];if(kk)dl=dl.replace(/ (오전|오후) \d{1,2}:\d{2}$/,'')}return}
    let who,txt,cont=false;const mm=line.match(/^([^:]{1,24}):(?: (.*))?$/);if(mm){who=mm[1];txt=mm[2]||''}else{cont=true;txt=line}
    const tm=txt.match(/\s*\(((?:오전|오후) \d{1,2}:\d{2})\)\s*$/);if(tm){time=tm[1];txt=txt.slice(0,tm.index)}
    if(cont){if(out.length)out[out.length-1][1]+='\n'+txt;return}
    out.push([who===CFG.me?'me':'them',txt,{n:who,time:kk?time:null,dk,dl}])});
  return out}
function loadChats(){Object.keys(CFG.chatsKk).forEach(id=>state.msgs.kk[id]=parseChat(CFG.chatsKk[id],true,''));
  Object.keys(CFG.chatsSms).forEach(id=>state.msgs.sms[id]=parseChat(CFG.chatsSms[id],false,''))}
function nowK(){let h,mi;if(CFG.fixedTime){[h,mi]=CFG.fixedTime.split(':').map(Number)}else{const d=new Date();h=d.getHours();mi=d.getMinutes()}return (h>=12?'오후 ':'오전 ')+(h%12||12)+':'+String(mi).padStart(2,'0')}
function mk(w,id,app,nm){const t=nowK(),wd=CFG.date.wd,dd=CFG.cal.y+'년 '+CFG.date.m+'월 '+CFG.date.d+'일 ';
  return {pend:w==='me'&&app==='kk'?(id==='group'?['강우진','여이삭']:[C[id].name]):null,n:w==='me'?CFG.me:(nm||(id==='group'?'강우진':C[id].name)),time:app==='kk'?t:null,dk:TODAYK,dl:app==='kk'?dd+wd:dd+'('+wd[0]+') '+t}}
function tsLast(id){const a=state.msgs.kk[id]||[];if(!a.length)return 0;const m=a[a.length-1][2]||{};return (Date.parse(m.dk||0)||0)/60000+KT(m.time)}
function listTime(id){const a=state.msgs.kk[id]||[];if(!a.length)return'';const m=a[a.length-1][2]||{};if(!m.dl||m.dk===TODAYK)return m.time||'';const y=new Date(TODAYK);y.setDate(y.getDate()-1);if(m.dk===y.toISOString().slice(0,10))return'어제';const p=m.dk.split('-');return (+p[1])+'월 '+(+p[2])+'일'}
function smsTime(id){const a=state.msgs.sms[id]||[];if(!a.length)return'';const p=((a[a.length-1][2]||{}).dk||'').split('-');return p[0]+'. '+(+p[1])+'. '+(+p[2])+'.'}
state.sun=Object.assign({},CFG.sunread);state.pend={};state.used={};
function sbadge(){const n=Object.values(state.sun).reduce((a,b)=>a+b,0);document.querySelectorAll('.bsms').forEach(e=>{e.textContent=n;e.classList.toggle('z',n<=0)})}
function tsLastS(id){const a=state.msgs.sms[id]||[];if(!a.length)return 0;const m=a[a.length-1][2]||{};return (Date.parse(m.dk||0)||0)/60000+KT(m.dl)}
loadChats();

  const d=document.createElement('div');if(!k[0])d.style.visibility='hidden';d.innerHTML=k[0]==='⌫'?'<span class="n">⌫</span>':`${k[0]}<small>${k[1]}</small>`;if(k[0]==='⌫')d.className='n';
  d.onclick=()=>{if(k[0]==='⌫')pw=pw.slice(0,-1);else if(pw.length<4)pw+=k[0];
    document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('f',i<pw.length));
    if(pw.length===4)setTimeout(()=>{pw='';document.querySelectorAll('#dots i').forEach(e=>e.classList.remove('f'));show('home')},220)};
  $('#pk').append(d)});

function gen(title,items,grid){$('#gt').textContent=title;const l=$('#gl');l.innerHTML='';

function openApp(k){if(k==='weather')return;

  else if(k==='notes'){renderNotes();show('memo')}else if(k==='chrome'){renderChrome();show('chr')}else if(k==='clock'){renderClock();show('clk')}else gen(A[k][0],CFG.apps[k]||[])}

function renderKk(){const box=$('#kll');box.innerHTML=AD;

function renderSms(){const box=$('#sll');box.innerHTML='';

    r.innerHTML=`${state.sun[id]?'<i class="dot"></i>':''}<div class="kav rd"></div><div class="m"><div class="t1"><b>${c.name}</b><small>${smsTime(id)}</small></div><div class="pv">${esc(last('sms',id))}</div></div>`;

function openChat(app,id){state.app=app;state.id=id;if(app==='sms'&&state.sun[id]){delete state.sun[id];badges()}
  if(app==='kk'&&state.un[id]){state.kb-=state.un[id];state.un[id]=0;badges()}
  $('#chat').className='scr '+app;show('chat');$('#cn').innerHTML=esc(C[id].name)+(C[id].count?` <span style="color:#555;font-weight:400">${C[id].count}</span>`:'');draw();$('#in').focus()}
function draw(){const m=$('#ms');m.innerHTML='';const kk=state.app==='kk',arr=state.msgs[state.app][state.id];let pdk=null,pw=null;
  arr.forEach((x,i)=>{const mt=x[2]||{},nx=arr[i+1];
    if(mt.dk!==pdk){if(mt.dl){const s=document.createElement('div');s.className='ds';s.textContent=mt.dl;m.append(s)}pdk=mt.dk;pw=null}
    const first=pw!==mt.n;pw=mt.n;const b=document.createElement('div');b.className='b '+x[0];const pm=x[1].match(/^\(사진:([^)]+)\)$/);
    const em=x[1].match(/^\(이모티콘:(\w+)\)$/);if(em){b.className+=' pho emo';b.innerHTML='<img class="p1" src="'+PHOTOS[em[1]]+'">'}else if(pm){b.className+=' pho';const ks=pm[1].split(',');b.innerHTML=ks.length>1?'<div class="pbx">'+ks.map(k=>'<img src="'+PHOTOS[k]+'">').join('')+'</div>':'<img class="p1" src="'+PHOTOS[ks[0]]+'">'}else b.textContent=x[1];
    if(!kk){m.append(b);return}
    const nm=nx&&nx[2]&&nx[2].n===mt.n&&nx[2].time===mt.time&&nx[2].dk===mt.dk,tt=document.createElement('small');tt.className='tt';tt.textContent=mt.time||'';
    const showT=mt.time&&!nm;
    if(x[0]==='me'){const r=document.createElement('div');r.className='mr me'+(first?' f':'');r.append(b);const pn=mt.pend?mt.pend.length:0;if(pn||showT){const u=document.createElement('span');u.className='mi';u.innerHTML=(pn?'<b>'+pn+'</b>':'')+(showT?'<small>'+mt.time+'</small>':'');r.append(u)}m.append(r)}
    else{const w=document.createElement('div');w.className='mw'+(first?' f':'');w.innerHTML=`<div class="kav sm"${first?'':' style="visibility:hidden"'}></div>`;
      const c=document.createElement('div');c.className='mc';if(first)c.innerHTML=`<small class="nmx">${esc(mt.n||'')}</small>`;
      const r=document.createElement('div');r.className='mr';r.append(b);if(showT)r.append(tt);c.append(r);w.append(c);m.append(w)}});
  m.scrollTop=m.scrollHeight}
$('#bk').onclick=()=>{state.app==='kk'?(renderKk(),show('kl')):(renderSms(),show('sl'))};
function send(){const i=$('#in'),t=i.value.trim();if(!t)return;i.value='';
  const {app,id}=state;state.msgs[app][id].push(['me',t,mk('me',id,app)]);draw();
  const rules=((CFG.replies[app]||{})[id])||[];let rep=null,call=false;
  if(state.pend[id]){rep=state.pend[id];delete state.pend[id]}
  else for(let n=0;n<rules.length;n++){const r=rules[n];if(!r.k.some(k=>t.includes(k)))continue;if(r.once&&state.used[id+n])continue;if(r.once)state.used[id+n]=1;rep=r.r;call=!!r.call;if(r.then)state.pend[id]=r.then;break}
  if(!rep)return;let d=900;
  rep.forEach(x=>{
    setTimeout(()=>{if(state.id!==id||state.app!==app||cur!=='chat')return;const ty=document.createElement('div');ty.className='b them ty';ty.id='ty';ty.innerHTML='<i></i><i></i><i></i>';$('#ms').append(ty);$('#ms').scrollTop=1e9},d);d+=1100;
    setTimeout(()=>{const e=$('#ty');e&&e.remove();state.msgs[app][id].push(['them',x[1],mk('them',id,app,x[0])]);state.msgs[app][id].forEach(q=>{if(q[2]&&q[2].pend)q[2].pend=q[2].pend.filter(n=>n!==x[0])});if(state.id===id&&state.app===app&&cur==='chat')draw()},d);d+=300});
  if(call)setTimeout(()=>{if(cur!=='call')startCall(id,null,true)},d+1500)}
$('#sd').onclick=send;$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};

function renderPhotos(){let g='';const ids=[...Array(60).keys()];let sd=11;const rn=()=>(sd=(sd*9301+49297)%233280)/233280;
  for(let i=59;i>0;i--){const j=Math.floor(rn()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const pm={};PIX.forEach((u,k)=>pm[ids[k]]=u);
  for(let i=0;i<60;i++){if(pm[i]){g+=`<i style="background:url(${pm[i]}) center/cover"></i>`;continue}const h=(i*53+20)%360,h2=(h+40)%360;g+=`<i style="background:linear-gradient(${(i*37)%180}deg,hsl(${h},32%,${60+i%4*6}%),hsl(${h2},36%,${48+i%3*8}%))"></i>`}
  $('#photo').innerHTML=`<div class="pg">${g}</div><div class="ph2"><h1>보관함</h1><small>${CFG.photoCount}개의 항목</small></div><div class="ph3"><span class="c2">${SV.menu}</span><span class="p2">선택</span></div><div class="tp"><div class="on">${SV.gal}보관함</div><div>${SV.col}모음</div></div><span class="c2 sr2">${SV.srch}</span>`}

/* 홈 제스처: 화면 맨 아래를 위로 스와이프 */
function goHome(){endTimers();if(cur==='lock')show('pass');else if(cur!=='pass'&&cur!=='home')show('home')}
$('#lock').onclick=()=>show('pass');
let gy=null;const hh=$('#hh');
hh.onpointerdown=e=>{gy=e.clientY;hh.setPointerCapture(e.pointerId)};
hh.onpointerup=e=>{if(gy===null)return;const dy=e.clientY-gy;gy=null;if(dy<-25||Math.abs(dy)<6)goHome()};
hh.onpointercancel=()=>{gy=null};

function fit(){const p=$('#ph');if(innerWidth>500)p.style.setProperty('--s',Math.min(1,(innerHeight-24)/876,(innerWidth-24)/417));else p.style.removeProperty('--s')}
fit();addEventListener('resize',fit);
</script>
